<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>FLAPS | Estimate Story Points</title>
  <meta name="description" content="FLAPS — a fast, real-time Fibonacci story point estimation tool for agile teams." />
  <meta name="theme-color" content="#0e1726" />

  <!-- Google Fonts - Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet" />

  <!-- Local assets served from /public at site root via express.static(...) -->
  <link rel="stylesheet" href="/styles.css" />

  <!-- Optional favicons/logo if you have them -->
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
</head>

<body>
  <noscript>
    <div class="card" style="margin:14px">
      JavaScript is required for FLAPS to work. Please enable JavaScript.
    </div>
  </noscript>

  <header>
    <div class="headerTop">
      <div class="brand">
        <div class="logo" aria-hidden="true">
          <img class="logoImg" src="/logo.png" alt="FLAPS - Fibonacci Lean Agile Pointing System" loading="lazy" width="125" height="125" />
        </div>
      </div>
    </div>

    <div class="roombar" role="group" aria-label="Room and user controls">
      <!-- Row 1: Create Room / Room Created + Share Link -->
      <div class="roombarRow1">
        <button id="createRoomBtn" class="primary" type="button">Create Room</button>
        <button id="shareParticipantBtn" class="shareHeaderBtn hidden" type="button" aria-label="Share participant link">
          <span class="shareHeaderIcon">🔗</span>
          <span class="shareHeaderText">Share Participant Link</span>
          <span class="shareHeaderIcon">👤</span>
        </button>
      </div>
      
      <!-- Row 2: Emoji + Name + Join -->
      <div class="roombarRow2">
        <label class="vh" for="emoji">Choose your emoji</label>
        <select id="emoji" name="emoji" class="emojiSelect" aria-label="Choose your emoji" title="Choose your emoji">
          <option value="">🙂</option>
          <option value="😀">😀</option>
          <option value="😎">😎</option>
          <option value="🤓">🤓</option>
          <option value="🤩">🤩</option>
          <option value="🥳">🥳</option>
          <option value="🚀">🚀</option>
          <option value="🔥">🔥</option>
          <option value="⭐">⭐</option>
          <option value="🌈">🌈</option>
          <option value="🦄">🦄</option>
          <option value="🐱">🐱</option>
          <option value="🐶">🐶</option>
          <option value="🦊">🦊</option>
          <option value="🐼">🐼</option>
          <option value="🐸">🐸</option>
          <option value="🦁">🦁</option>
          <option value="🐧">🐧</option>
          <option value="🦉">🦉</option>
          <option value="🐢">🐢</option>
          <option value="🍕">🍕</option>
          <option value="🎸">🎸</option>
          <option value="🎉">🎉</option>
          <option value="🏆">🏆</option>
        </select>
        <label class="vh" for="name">Your Name</label>
        <input id="name" name="name" placeholder="Your Name" autocomplete="name"
               inputmode="text" aria-label="Your Name" style="text-transform:uppercase" maxlength="20" />
        <button id="joinBtn" class="primary" type="button">Join</button>
      </div>
    </div>
  </header>

  <main class="grid">
    <!-- Story -->
    <section class="card" aria-labelledby="storyHeader">
      <div class="cardHeader">
        <h2 id="storyHeader">Story</h2>
        <span id="modePill" class="pill" aria-live="polite">Not Connected</span>
      </div>

      <div class="storyForm">
        <h3 class="resultsTitle">Add a Story</h3>

        <div class="storyInputCol">
          <div class="jiraNumberField">
            <label class="vh" for="jiraNumber">Jira Number</label>
            <input id="jiraNumber" placeholder="Jira #" maxlength="12" />
          </div>
          <div class="storyTitleField">
            <label class="vh" for="storyTitle">Story Title</label>
            <input id="storyTitle" placeholder="Story Title" maxlength="100" />
          </div>
          <div class="storyDescField">
            <label class="vh" for="storyDesc">Story Description</label>
            <textarea id="storyDesc" placeholder="Short Description (optional)" maxlength="100" rows="2"></textarea>
          </div>
        </div>

        <button id="addToQueueBtn" class="primary queueTitleBtn" type="button">Add Story To Queue</button>

        <h3 class="resultsTitle">Story Queue</h3>
        
        <div class="queueListWrap">
          <ul id="storyQueueList" class="queueList"></ul>
        </div>
      </div>
    </section>

    <!-- Vote -->
    <section class="card" aria-labelledby="voteHeader">
      <div class="cardHeader">
        <h2 id="voteHeader">Vote</h2>
        <span id="votePill" class="pill" aria-live="polite">Waiting</span>
      </div>

      <h3 class="resultsTitle voteTitle">Cast Your Vote</h3>
      <div id="deck" class="deck" aria-label="Voting deck"></div>

      <div class="controls">
        <button id="revealBtn" class="primary" type="button">Reveal</button>
        <button id="clearBtn" type="button">Clear / Revote</button>
      </div>

      <div class="resultsSection">
        <h3 class="resultsTitle">Estimation Results</h3>
        <div id="results" aria-label="Results"></div>
      </div>

      <div class="voteBottom">
        <h3 class="resultsTitle">Finalize Estimate</h3>
        
        <div class="finalizeSection">
          <div class="finalizeLabel">Select Final Points:</div>
          
          <div id="finalPointsChips" class="finalPointsChips" role="radiogroup" aria-label="Final points selection">
            <!-- Chips generated dynamically from deck -->
          </div>
        </div>
      </div>
    </section>

    <!-- Users -->
    <section class="card" aria-labelledby="usersHeader">
      <div class="cardHeader">
        <h2 id="usersHeader">Users</h2>
        <span id="usersPill" class="pill" aria-live="polite">0</span>
      </div>
      <ul id="usersList" class="users" aria-label="Connected users"></ul>
    </section>
  </main>

  <footer>
    <div class="footerLeft">
      <span class="footerTagline">Fibonacci Lean Agile Pointing System</span>
    </div>
    <div class="footerRight">
      <span class="footerItem">© <span id="currentYear"></span>&nbsp;&nbsp;&nbsp;GLM</span>
      <span class="footerItem" style="display: flex; align-items: center; gap: 6px;">
        Engineered by Kiro
        <img src="/kiro-logo.svg" alt="Kiro" style="width: 20px; height: 20px; border-radius: 4px;" />
      </span>
      <a href="https://github.com/artificialairspeed/FLAPS" target="_blank" rel="noopener noreferrer" class="footerLink">
        GitHub
        <img src="/github-logo.svg" alt="GitHub" style="width: 20px; height: 20px;" />
      </a>
    </div>
  </footer>

  <!-- Socket.IO client served by your server.js -->
  <script src="/socket.io/socket.io.js" defer></script>
  <script src="/app.js" defer></script>
  <script>
    // Dynamically set current year
    document.getElementById('currentYear').textContent = new Date().getFullYear();
  </script>
</body>
</html>
